name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install (npm 12 honours the allowScripts list in package.json)
        run: npx -y npm@12.2.1 ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
